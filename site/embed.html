<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识助手</title>
<style>
  :root{
    --brand:#2f6fed; --brand-soft:#eef3ff;
    --ink:#141a23; --ink-2:#5a6472; --ink-3:#8b95a3;
    --line:#e6e9ee; --bg:#fbfcfe; --card:#fff;
    --ok:#12805c; --warn:#a55b00; --bad:#b3261e;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--card);display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  /* 头部 */
  header{
    display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);
    background:var(--card);flex:0 0 auto;
  }
  .logo{
    width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 auto;
  }
  .ht{flex:1;min-width:0}
  .ht b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
  .ht span{display:block;font-size:11px;color:var(--ink-3);line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .close{
    border:0;background:transparent;color:var(--ink-3);font-size:18px;cursor:pointer;
    width:28px;height:28px;border-radius:8px;line-height:1;
  }
  .close:hover{background:#f2f4f7;color:var(--ink)}
  /* 消息区 */
  #log{flex:1;overflow-y:auto;padding:16px 14px 8px;background:var(--bg);scroll-behavior:smooth}
  .msg{display:flex;margin-bottom:14px;gap:8px}
  .msg.me{justify-content:flex-end}
  .bubble{
    max-width:86%;padding:10px 12px;border-radius:12px;background:var(--card);
    border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,24,40,.04);word-break:break-word;
  }
  .me .bubble{background:var(--brand);border-color:var(--brand);color:#fff;border-bottom-right-radius:4px}
  .ai .bubble{border-bottom-left-radius:4px}
  .bubble p{margin:0 0 8px}
  .bubble p:last-child{margin-bottom:0}
  .bubble strong{font-weight:650}
  .bubble ul{margin:6px 0;padding-left:18px}
  .bubble li{margin:3px 0}
  .cite-ref{color:var(--brand);font-size:11px;vertical-align:super;font-weight:600}
  .me .cite-ref{color:#dbe6ff}
  /* 图片 */
  .figs{display:grid;gap:8px;margin-top:10px}
  .figs.n1{grid-template-columns:1fr}
  .figs.n2{grid-template-columns:1fr 1fr}
  figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  figure img{display:block;width:100%;height:auto;cursor:zoom-in;background:#f6f7f9}
  figcaption{font-size:11px;color:var(--ink-3);padding:5px 8px;border-top:1px solid var(--line);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 引用 */
  .cites{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
  .cite{
    font-size:11px;color:var(--ink-2);background:#f5f7fa;border:1px solid var(--line);
    border-radius:6px;padding:2px 7px;cursor:default;max-width:100%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .cite b{color:var(--brand);font-weight:600;margin-right:2px}
  .flag{
    margin-top:8px;font-size:11.5px;padding:6px 9px;border-radius:7px;
    background:#fff8e8;color:var(--warn);border:1px solid #f2e2c0;
  }
  .flag.hard{background:#fdecea;color:var(--bad);border-color:#f5cdc8}
  .fb{display:flex;gap:10px;margin-top:8px}
  .fb button{
    border:0;background:transparent;color:var(--ink-3);font-size:11.5px;cursor:pointer;padding:0;
  }
  .fb button:hover{color:var(--brand)}
  /* 欢迎页 */
  .welcome{padding:6px 2px 0}
  .welcome h3{font-size:15px;margin:0 0 6px}
  .welcome p{color:var(--ink-2);font-size:12.5px;margin:0 0 14px}
  .sg{display:flex;flex-direction:column;gap:7px}
  .sg button{
    text-align:left;background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;font-size:12.5px;color:var(--ink);cursor:pointer;line-height:1.4;
  }
  .sg button:hover{border-color:var(--brand);background:var(--brand-soft)}
  /* 输入区 */
  footer{flex:0 0 auto;border-top:1px solid var(--line);padding:10px 12px 8px;background:var(--card)}
  .box{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:12px;
    padding:7px 8px;background:#fff;transition:border-color .15s,box-shadow .15s}
  .box:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  #q{
    flex:1;border:0;outline:0;resize:none;font:inherit;font-size:13.5px;line-height:1.5;
    max-height:110px;padding:3px 2px;background:transparent;color:var(--ink);
  }
  #send{
    border:0;background:var(--brand);color:#fff;width:32px;height:32px;border-radius:9px;
    cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
  }
  #send:disabled{opacity:.4;cursor:not-allowed}
  #send svg{width:16px;height:16px}
  .hint{font-size:10.5px;color:var(--ink-3);text-align:center;margin-top:6px}
  /* 思考中 */
  .dots{display:flex;gap:4px;padding:4px 2px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:b 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.15s}
  .dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  /* 大图 */
  #lb{position:fixed;inset:0;background:rgba(10,14,20,.82);display:none;place-items:center;padding:16px;z-index:99}
  #lb.on{display:grid}
  #lb img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
  @media (max-width:420px){ .bubble{max-width:92%} }
</style>
</head>
<body>
<header>
  <div class="logo">知</div>
  <div class="ht">
    <b id="title">内部知识助手</b>
    <span id="sub">仅依据已收录文档作答</span>
  </div>
  <button class="close" id="btnClose" title="关闭">✕</button>
</header>

<div id="log">
  <div class="welcome" id="welcome">
    <h3>有什么可以帮你？</h3>
    <p>我的回答只来自公司已收录的文档，每句都带出处。文档里没有的，我会直接说不知道。</p>
    <div class="sg" id="sg"></div>
  </div>
</div>

<footer>
  <div class="box">
    <textarea id="q" rows="1" placeholder="输入问题，Enter 发送"></textarea>
    <button id="send" title="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9z"/></svg>
    </button>
  </div>
  <div class="hint">答案仅供内部参考，以引用原文为准</div>
</footer>

<div id="lb"><img alt=""></div>

<script src="config.js"></script>
<script>
const qs = new URLSearchParams(location.search);
const SOURCE = qs.get('source') || '';
const TOKEN = qs.get('token') || '';
const BRAND = qs.get('color') || getComputedStyle(document.documentElement).getPropertyValue('--brand').trim();
if (qs.get('color')) document.documentElement.style.setProperty('--brand', qs.get('color'));
if (qs.get('title')) document.getElementById('title').textContent = qs.get('title');
document.title = document.getElementById('title').textContent;

const $ = s => document.querySelector(s);
const log = $('#log'), q = $('#q'), send = $('#send');
let history = [], busy = false;

const FLAG_TEXT = {
  grounding_violation:'答案含文档外信息，已拦截并改为原文摘录',
  fallback_quote:'已降级为原文摘录',
  no_citation:'未能标注出处，已降级为原文',
  invalid_citation:'引用编号异常，已降级为原文',
  low_confidence:'置信度偏低',
  out_of_scope:'知识库未收录该主题'
};

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* 极简 markdown：加粗、行内代码、列表、表格降级为等宽块。够用且不会 XSS。 */
function md(t){
  let h = esc(t);
  h = h.replace(/```([\s\S]*?)```/g,(_,c)=>`<pre style="background:#f6f7f9;padding:8px;border-radius:8px;overflow:auto;font-size:12px">${c.trim()}</pre>`);
  h = h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/`([^`]+)`/g,'<code style="background:#f2f4f7;padding:1px 4px;border-radius:4px;font-size:12px">$1</code>');
  h = h.replace(/\[(\d+)\]/g,'<sup class="cite-ref">$1</sup>');
  const blocks = h.split(/\n{2,}/).map(b=>{
    const lines = b.split('\n');
    if (lines.every(l=>/^\s*[-*·]\s+/.test(l))) {
      return '<ul>'+lines.map(l=>'<li>'+l.replace(/^\s*[-*·]\s+/,'')+'</li>').join('')+'</ul>';
    }
    if (lines.every(l=>l.trim().startsWith('|'))) {
      return '<pre style="overflow:auto;font-size:12px;background:#f6f7f9;padding:8px;border-radius:8px">'+b+'</pre>';
    }
    return '<p>'+b.replace(/\n/g,'<br>')+'</p>';
  });
  return blocks.join('');
}

function bubble(role, html){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  wrap.innerHTML = `<div class="bubble">${html}</div>`;
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return wrap.querySelector('.bubble');
}

function figs(images){
  if (!images || !images.length) return '';
  const n = Math.min(images.length, 2);
  const cards = images.map(im=>`
    <figure>
      <img loading="lazy" src="${esc(im.src)}" alt="${esc(im.alt)}" data-full="${esc(im.src)}">
      <figcaption>${esc(im.alt || '截图')}${im.section ? ' · ' + esc(im.section) : ''}</figcaption>
    </figure>`).join('');
  return `<div class="figs n${n}">${cards}</div>`;
}

function cites(cs){
  if (!cs || !cs.length) return '';
  return `<div class="cites">${cs.map(c=>
    `<span class="cite" title="${esc(c.snippet||'')}"><b>[${c.n}]</b>${esc(c.title)}${c.section?' · '+esc(c.section):''}</span>`).join('')}</div>`;
}

async function api(path, opts={}){
  const r = await fetch(KB_URL(path), {
    ...opts,
    headers: {'Content-Type':'application/json', ...(TOKEN?{Authorization:'Bearer '+TOKEN}:{}), ...(opts.headers||{})}
  });
  if (!r.ok) throw new Error(await r.text() || ('HTTP ' + r.status));
  return r.json();
}

function streamAsk(body, onEvent){
  const ctrl = new AbortController();
  return fetch(KB_URL('/ask/stream'), {
    method:'POST',
    headers:{'Content-Type':'application/json', ...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},
    body: JSON.stringify(body),
    signal: ctrl.signal
  }).then(res=>{
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let acc = '';
    const pump = () => reader.read().then(({value, done})=>{
      if (done) return;
      acc += dec.decode(value, {stream:true});
      let i;
      while ((i = acc.indexOf('\n\n')) >= 0){
        const chunk = acc.slice(0, i); acc = acc.slice(i + 2);
        const line = chunk.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        try { onEvent(JSON.parse(line.slice(5).trim())); } catch(e){}
      }
      return pump();
    });
    return pump();
  });
}

async function ask(text){
  if (busy || !text.trim()) return;
  busy = true; send.disabled = true;
  $('#welcome')?.remove();
  bubble('me', esc(text).replace(/\n/g,'<br>'));
  history.push({role:'user', content:text});
  q.value=''; q.style.height='auto';

  const holder = bubble('ai', '<div class="dots"><i></i><i></i><i></i></div>');
  const t0 = Date.now();
  let buf = '', firstAt = 0;

  const finish = (d, elapsed) => {
    const flags = (d.flags||[]).filter(f=>FLAG_TEXT[f]);
    const hard = (d.flags||[]).some(f=>['grounding_violation','no_citation','invalid_citation'].includes(f));
    holder.innerHTML =
      md(d.answer) +
      figs(d.images) +
      cites(d.citations) +
      (flags.length ? `<div class="flag ${hard?'hard':''}">${flags.map(f=>FLAG_TEXT[f]).join(' · ')}</div>` : '') +
      `<div class="fb"><button data-fb="good">有帮助</button><button data-fb="bad">不准确</button><span style="color:var(--ink-3);font-size:11px">${elapsed}s</span></div>`;
    holder.querySelectorAll('[data-fb]').forEach(b=>b.onclick=async()=>{
      b.parentElement.innerHTML = '<span style="font-size:11px;color:var(--ok)">感谢反馈，已记录</span>';
      try{ await api('/feedback',{method:'POST',body:JSON.stringify({question:text, answer:d.answer, verdict:b.dataset.fb==='good'?'good':'bad', source:SOURCE})}); }catch(e){}
    });
    history.push({role:'assistant', content:d.answer});
    log.scrollTop = log.scrollHeight;
  };

  try {
    await streamAsk(
      {question:text, history:history.slice(-5,-1), source:SOURCE},
      ev => {
        if (ev.type === 'token'){
          if (!firstAt) firstAt = Date.now();
          buf += ev.text;
          // 流式阶段只渲染纯文本，等 final 再上 markdown / 截图 / 引用卡片，
          // 否则每来一个字都要重排一次已经渲染好的图表，长答案会明显卡
          holder.innerHTML = `<div style="white-space:pre-wrap">${esc(buf)}</div>`;
          log.scrollTop = log.scrollHeight;
        } else if (ev.type === 'error'){
          buf += `\n（${ev.message}）`;
          holder.innerHTML = `<div style="white-space:pre-wrap">${esc(buf)}</div>`;
        } else if (ev.type === 'final'){
          finish(ev, ((Date.now()-t0)/1000).toFixed(1));
        }
      }
    );
  } catch(e){
    holder.innerHTML = `<div class="flag hard">请求失败：${esc(String(e.message).slice(0,160))}</div>`;
  } finally {
    busy = false; send.disabled = false; q.focus();
    log.scrollTop = log.scrollHeight;
  }
}

/* 发送 */
send.onclick = () => ask(q.value);
q.addEventListener('keydown', e=>{
  if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ask(q.value); }
});
q.addEventListener('input', ()=>{ q.style.height='auto'; q.style.height=Math.min(q.scrollHeight,110)+'px'; });

/* 关闭：优先通知父页面收起悬浮窗 */
$('#btnClose').onclick = ()=>{ try{ parent.postMessage({type:'kb-widget-close'},'*'); }catch(e){} };

/* 宿主系统可以调用 KBWidget.ask('...') 直接带问题打开 */
window.addEventListener('message', e=>{
  if (e.data && e.data.type==='kb-ask' && e.data.text) ask(String(e.data.text));
});

/* 图片放大 */
log.addEventListener('click', e=>{
  const img = e.target.closest('img[data-full]');
  if (!img) return;
  $('#lb img').src = img.dataset.full;
  $('#lb').classList.add('on');
});
$('#lb').onclick = ()=> $('#lb').classList.remove('on');

/* 建议问题：从已有文档生成，避免写死业务内容 */
(async ()=>{
  try{
    const d = await api('/kb/docs');
    const docs = (d.docs||[]).filter(x=>x.chunks>0).slice(0,3);
    const sgs = docs.map(x=>'总结一下《'+x.title+'》的要点');
    if (docs.length) sgs.push('《'+docs[0].title+'》里最关键的一条是什么？');
    $('#sg').innerHTML = sgs.slice(0,3).map(s=>`<button>${esc(s)}</button>`).join('');
    $('#sg').querySelectorAll('button').forEach(b=>b.onclick=()=>ask(b.textContent));
  }catch(e){}
})();
</script>
</body>
</html>
